#Difficulty Control (1-3 for easy/medium/hard)
# Default: 2
# Range: 1 ~ 3
difficulty = 2
#Owner-Only Machine Use
lockMachines = false
#Direct Block Damage from Machine Failures
blockDamage = true
#Crafting Table can Make Machines (if false, the Worktable is required to craft machines)
tableMachines = false
#Engine Volume
# Default: 1.0
# Range: 0.0 ~ 1.0
engineVolume = 1.0
#Machine Volume Multiplier
# Default: 1.0
# Range: 0.0 ~ 1.0
machineVolume = 1.0
#Color Blind Mode
colorBlind = false
#Spawn XP from Friction Heater
frictionXP = true
#Extractor Drill Wears Down
extractorMaintain = false
#Allow Bedrock Breaker to Break Y=0 (the world's bottom layer)
voidHole = false
#Rotate Hose/Pipe/Fuel Line Recipes (recipe conflict avoidance)
rotateHose = false
#Fluid Flow Speed (1-5)
# Default: 5
# Range: 1 ~ 5
flowSpeed = 5
#Pipe Block Hardness (0-1)
# Default: 0.0
# Range: 0.0 ~ 1.0
pipeHardness = 0.0
#Max Heat Ray Range
# Default: 128
# Range: > 0
heatRayRange = 128
#Block Damage from Destructive Machines
attackBlocks = true
