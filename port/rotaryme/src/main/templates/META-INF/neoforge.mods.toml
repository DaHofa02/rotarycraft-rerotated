modLoader="javafml"
loaderVersion="${loader_version_range}"
license="${mod_license}"

[[mods]]
modId="${mod_id}"
version="${mod_version}"
displayName="${mod_name}"
authors="Private addon for the RotaryCraft port"
description='''
Stores RotaryCraft shaft energy in an Applied Energistics 2 network: a kinetic input, a kinetic output and kinetic storage cells.
Private addon; not for distribution.
'''

[[dependencies.${mod_id}]]
    modId="neoforge"
    type="required"
    versionRange="${neo_version_range}"
    ordering="NONE"
    side="BOTH"
[[dependencies.${mod_id}]]
    modId="minecraft"
    type="required"
    versionRange="${minecraft_version_range}"
    ordering="NONE"
    side="BOTH"
[[dependencies.${mod_id}]]
    modId="rotarycraft"
    type="required"
    versionRange="[${mod_version},)"
    ordering="AFTER"
    side="BOTH"
[[dependencies.${mod_id}]]
    modId="ae2"
    type="required"
    versionRange="[19.2.0,)"
    ordering="AFTER"
    side="BOTH"
