dependencies {
    implementation project(':rotarycraft')
}

// Dev-only: the RotaryCraft showcase screenshots (DevShowcase) of the ElectriCraft scene (sh tools/make_showcase.sh electricraft tools/showcase_electricraft).
neoForge {
    runs {
        showcase {
            client()
            programArguments.addAll '--quickPlaySingleplayer', 'showcase'
            systemProperty 'rotarycraft.showcase', 'true'
            systemProperty 'rotarycraft.showcase.views', '5.0,-58.4,-2.5,0,30;3.0,-59.3,1.3,0,40;6.5,-58.8,7.5,180,35;5.0,-57.5,5.5,0,40;8.0,-58.3,14.5,180,35;7.5,-58.7,12.6,180,70;6.0,-58.6,19.5,180,25;6.0,-58.5,23.0,180,30;5.0,-56.0,26.0,180,60'
            systemProperty 'rotarycraft.showcase.guis', '6,-60,20;4,-59,24'
        }
    }
}
