modLoader="javafml"
loaderVersion="${loader_version_range}"
license="${mod_license}"

[[mods]]
modId="${mod_id}"
version="${mod_version}"
displayName="${mod_name}"
authors="${mod_authors}"
logoFile="rotarycraft_logo.png"
description='''
Mechanical shaft power: engines, transmissions and machines driven by torque and rotational speed.
Private NeoForge ${minecraft_version} port of the 1.7.10 original by Reika Kalseki. Not for distribution.
'''

[[dependencies.${mod_id}]]
    modId="neoforge"
    type="required"
    versionRange="${neo_version_range}"
    ordering="NONE"
    side="BOTH"

[[dependencies.${mod_id}]]
    modId="minecraft"
    type="required"
    versionRange="${minecraft_version_range}"
    ordering="NONE"
    side="BOTH"


[[accessTransformers]]
file="META-INF/accesstransformer.cfg"
