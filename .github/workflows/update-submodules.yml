name: Update Submodules
on:
  schedule:
    - cron: '*/1 * * * *' # prüft alle 30 Minuten auf neue Commits in 1.21.1-claude
  workflow_dispatch:       # zusätzlich manuell per Button auf GitHub startbar

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: true
          token: ${{ secrets.GITHUB_TOKEN }}
      - name: Update submodules to latest branch commit
        run: |
          git submodule update --remote --merge
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add port/
          git diff --staged --quiet || git commit -m "chore: update submodules to latest 1.21.1-claude"
          git push